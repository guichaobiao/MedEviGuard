[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medeviguard"
version = "0.1.0"
description = "Evidence-guided medical image authenticity verification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["torch", "transformers", "safetensors", "numpy", "Pillow", "PyYAML", "scikit-learn"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
medeviguard = "medeviguard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medeviguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
